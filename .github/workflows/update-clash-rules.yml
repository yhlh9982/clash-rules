name: Update clash rules Rules

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Download mihomo
        run: |
          set -e
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep "browser_download_url.*mihomo-linux-amd64-v" | head -n 1 | cut -d '"' -f 4)
          echo "获取到的下载链接: $DOWNLOAD_URL"
          wget -O mihomo.gz "$DOWNLOAD_URL"
          gzip -d mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo
          mihomo -v

      - name: Collect rules
        run: |
          set -e
          python scripts/collect_rules.py

      - name: Build MRS
        env:
          MIHOMO_BIN: /usr/local/bin/mihomo
        run: |
          set -e
          python scripts/build_mrs.py

      - name: Remove old root output files
        run: |
          rm -f convert_trackers.py
          rm -f trackers_domain.txt
          rm -f trackers_ip.txt
          rm -f trackers_domain_raw.txt
          rm -f trackers_ip_raw.txt
          rm -f trackers_domain.yaml
          rm -f trackers_ip.yaml

      - name: Commit text changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add data product scripts .github/workflows/update-trackers.yml README.md
          git add -u

          if git diff --cached --quiet; then
            echo "No text changes to commit."
          else
            git commit -m "chore: auto update rules ($(date -u +'%Y-%m-%d'))"
            git push
          fi

      - name: Upload MRS files to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tracker-rules
          name: Tracker Rules
          body: |
            Automatically generated rule sets.

            TXT/YAML files are kept in the repository for viewing.

            MRS files are provided here for Mihomo rule-providers.

            Files:
            - Jcdn.mrs
            - Jweb.mrs
            - cnlite.mrs
            - trackers_domain.mrs
            - trackers_ip.mrs
            - proxy.mrs
            - direct.mrs
            - reject.mrs
            - cncidr.mrs
          files: |
            release/Jcdn.mrs
            release/Jweb.mrs
            release/cnlite.mrs
            release/trackers_domain.mrs
            release/trackers_ip.mrs
            release/proxy.mrs
            release/direct.mrs
            release/reject.mrs
            release/cncidr.mrs
          make_latest: true
          overwrite_files: true
